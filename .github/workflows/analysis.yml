name: Analysis CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - name: Regenerate analysis artifacts
        run: python src/create_dashboard.py --output "$RUNNER_TEMP/pizza-figures"
      - name: Verify expected figures
        run: test "$(find "$RUNNER_TEMP/pizza-figures" -maxdepth 1 -name '*.png' | wc -l)" -eq 4
